spring.application.name=smart-notes

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gemini
spring.ai.google.genai.api-key=${API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.8
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10s

logging.level.org.springframework.ai=DEBUG

#TRANSCRIPTION STT
spring.ai.model.audio.transcription=google-genai
spring.ai.google.genai.transcription.api-key=${API_KEY}
spring.ai.google.genai.transcription.model=gemini-3.5-flash-lite
spring.ai.google.genai.transcription.language=pt-BR
spring.ai.google.genai.transcription.prompt=Áudio em português brasileiro.

#SPEECH TTS
spring.ai.model.audio.speech=google-genai
spring.ai.google.genai.tts.model=gemini-2.5-flash-preview-tts
spring.ai.google.genai.tts.voice-name=Kore
spring.ai.google.genai.tts.language-code=pt-BR
spring.ai.google.genai.tts.audio-encoding=LINEAR16

